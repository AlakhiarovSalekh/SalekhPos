groups:
  - name: salekhpos
    rules:
      - alert: WorkerFailures
        expr: sum(rate(salekhpos_worker_jobs_total{outcome="failed"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: salekhpos
        annotations:
          summary: "Background jobs are failing"
          runbook: "docs/runbooks/workerfailures.md"
