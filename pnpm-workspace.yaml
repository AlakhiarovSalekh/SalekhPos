packages:
  - apps/*
  - packages/*
# Exact transitive security pins; check-node.ps1 also performs a real Expo Android bundle export.
overrides:
  image-size: 2.0.3
  uuid: 11.1.1
  decode-uri-component: 0.5.0
allowBuilds:
  unrs-resolver: true
# image-size 2.0.3 is the upstream security patch released on 2026-09-14.
minimumReleaseAgeExclude:
  - image-size@2.0.3
  - '@expo/cli@57.0.25 || 57.0.26'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23 || 57.0.24
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo-router@57.0.22
