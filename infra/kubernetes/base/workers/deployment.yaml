apiVersion: apps/v1
kind: Deployment
metadata: { name: salekhpos-worker, namespace: salekhpos }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: salekhpos-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: salekhpos-worker, app.kubernetes.io/part-of: salekhpos } }
    spec:
      serviceAccountName: salekhpos-worker
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: salekhpos-worker
          image: ghcr.io/alakhiarovsalekh/salekhpos-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: salekhpos-runtime }
            - secretRef: { name: salekhpos-webhook-secrets, optional: true }
          env:
            - name: ConnectionStrings__Application
              valueFrom: { secretKeyRef: { name: salekhpos-database, key: connection-string } }
            - name: Integrations__WebhookDispatch__Issuer
              valueFrom:
                secretKeyRef: { name: salekhpos-worker-identity, key: issuer, optional: true }
            - name: Integrations__WebhookDispatch__Subject
              valueFrom:
                secretKeyRef: { name: salekhpos-worker-identity, key: subject, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: {} } ]
      terminationGracePeriodSeconds: 45
