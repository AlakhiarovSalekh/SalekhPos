apiVersion: v1
kind: ConfigMap
metadata: { name: salekhpos-runtime, namespace: salekhpos }
data:
  ASPNETCORE_URLS: http://0.0.0.0:8080
  DOTNET_EnableDiagnostics: "0"
  Worker__MaxConcurrency: "8"
  Worker__QueueCapacity: "1024"
  Worker__RetryMaxAttempts: "5"
  Integrations__WebhookDispatch__Enabled: "false"
  Integrations__WebhookDispatch__PollInterval: "00:00:05"
  Integrations__WebhookDispatch__OrganizationPageSize: "50"
  Integrations__WebhookDispatch__MaximumDeliveriesPerOrganization: "20"
