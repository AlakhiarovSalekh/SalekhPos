apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-ingress, namespace: salekhpos }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: salekhpos-web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [ { protocol: TCP, port: 3000 } ]
