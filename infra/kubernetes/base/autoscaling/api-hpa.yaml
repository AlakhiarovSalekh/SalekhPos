apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: salekhpos-api, namespace: salekhpos }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: salekhpos-api }
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
