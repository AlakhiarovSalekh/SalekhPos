apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: salekhpos-worker, namespace: salekhpos }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: salekhpos-worker }
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
