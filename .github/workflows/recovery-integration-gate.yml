name: Recovery Integration Gate

on:
  push:
    branches:
      - recovery-integration-gate-20260918
    paths:
      - .github/workflows/recovery-integration-gate.yml

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: /tmp/salekhpos-nuget-packages
      ContinuousIntegrationBuild: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7dab277d6f49bab5091276d80a91b5bd56d49510
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          & ./scripts/dotnet.ps1 @('restore','SalekhPos.sln','--locked-mode')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          & ./scripts/dotnet.ps1 @('build','SalekhPos.sln','--configuration','Release','--no-restore','-warnaserror')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PostgreSQL and .NET tests
        run: ./scripts/ci/test-postgres.ps1 -ReportDirectory (Join-Path $env:RUNNER_TEMP 'integration-reports')
