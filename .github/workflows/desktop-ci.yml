name: Desktop Windows CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_MULTILEVEL_LOOKUP: '0'
  NUGET_XMLDOC_MODE: skip

jobs:
  desktop-windows:
    name: Desktop Windows build and tests
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Configure writable .NET install directory
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\dotnet" mkdir "%RUNNER_TEMP%\dotnet"
          echo DOTNET_INSTALL_DIR=%RUNNER_TEMP%\dotnet>>"%GITHUB_ENV%"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'

      - name: Runner diagnostics
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo DOTNET_INSTALL_DIR: %DOTNET_INSTALL_DIR%
          dotnet --version
          dotnet --info

      - name: Restore desktop solution
        shell: cmd
        run: dotnet restore apps\desktop\SalekhPos.Desktop.sln --locked-mode

      - name: Build desktop solution
        shell: cmd
        run: dotnet build apps\desktop\SalekhPos.Desktop.sln --configuration Release --no-restore

      - name: Test desktop
        shell: cmd
        run: dotnet test apps\desktop\tests\SalekhPos.Desktop.Tests\SalekhPos.Desktop.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
