name: Recovery Refresh NuGet Locks

on:
  push:
    branches:
      - recovery/local-backend-20260918
    paths:
      - .github/workflows/recovery-refresh-locks.yml

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: recovery/local-backend-20260918

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Re-evaluate NuGet lock files
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore SalekhPos.sln --force-evaluate
          git diff --check
          echo "Changed lock files:"
          git status --short | grep 'packages.lock.json' || true

      - name: Commit refreshed lock files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//' | grep 'packages.lock.json$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No NuGet lock files changed."
            exit 0
          fi
          git config user.name "SalekhPos CI Recovery"
          git config user.email "293670084+AlakhiarovSalekh@users.noreply.github.com"
          git add -- "${changed[@]}"
          git commit -m "fix: refresh NuGet locks for recovered modules"
          git push origin HEAD:recovery/local-backend-20260918
