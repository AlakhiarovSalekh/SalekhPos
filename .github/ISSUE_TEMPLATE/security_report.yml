name: Security reporting guidance
description: Instructions for private vulnerability reporting.
body:
  - type: markdown
    attributes:
      value: Use the private security report link for vulnerabilities. Never publish credentials or exploit details in public issues. This form is only for questions about the reporting process.
  - type: textarea
    id: process-question
    attributes:
      label: Reporting process question
      description: Ask about the reporting process only. Send vulnerability details through a private advisory.
    validations:
      required: true
